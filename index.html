<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Musician 音樂家</title>
<style>
  :root{
    --bg:#0e1122; --panel:#171b33; --line:#2a2f52; --text:#e8e4d8;
    --muted:#8a8fa8; --gold:#d4a94a; --blue:#7ea7d8;
    --colW:min(820px,100%);   /* 全頁同一欄寬：音色、簡譜、曲目、即興台、多聲部對齊同一條邊 */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 64px;
  }
  h1{font-size:28px; letter-spacing:2px; color:var(--gold);}
  .sub{color:var(--muted); font-size:14px; margin:8px 0 24px;}

  /* 音色區（2026-10-16 版面師／認知／考拉）：與曲目卡同寬、分兩組、同組等寬等高（同群按鍵規則） */
  .voices{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px;
          width:var(--colW); margin-bottom:8px;}
  .voices button{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 4px; font-size:15px; cursor:pointer; white-space:nowrap; min-height:42px;
  }
  .voices button.active{border-color:var(--gold); color:var(--gold); background:#1e1a2e;}
  .vsep{grid-column:1/-1; color:var(--muted); font-size:13px; text-align:left; margin-top:6px;}
  .vsep:first-child{margin-top:0;}
  .credits{margin-top:40px; font-size:13px;} .credits a{color:var(--muted);}
  @media (max-width:640px){ .voices{grid-template-columns:repeat(3,1fr);} }
  #mixToggle.mixOn{border-color:var(--blue); color:var(--blue); background:#141b33;}
  .hint{color:var(--muted); font-size:13px; margin:10px 0 22px;}

  .now{
    height:28px; font-size:16px; color:var(--blue); margin-bottom:14px;
    display:flex; align-items:center; gap:14px;
  }
  .now button{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:3px 14px; cursor:pointer; font-size:13px;
  }
  #modeBtn{color:var(--blue); border-color:var(--line); font-family:inherit;}
  #muteBtn{font-size:15px; padding:3px 12px; line-height:1.4;}
  #muteBtn.off{color:var(--gold); border-color:var(--gold);}

  .tunes{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
         gap:12px; width:var(--colW);}
  .tune{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; cursor:pointer; text-align:left; color:var(--text);
    display:flex; flex-direction:column; gap:4px; font-family:inherit;
  }
  .tune:hover{border-color:var(--blue);}
  .tune.playing{border-color:var(--gold); background:#1e1a2e;}
  .tune .name{font-size:17px;}
  .tune .orig{font-size:11.5px; color:var(--blue); font-style:italic; opacity:.85;}
  .tune .meta{font-size:12px; color:var(--muted);}
  .chips{display:flex; gap:6px; margin-top:6px;}
  .chip{font-size:12px; padding:3px 12px; border:1px solid var(--line); border-radius:999px;
        background:none; color:var(--blue); cursor:pointer; font-family:inherit;}
  .chip:hover{border-color:var(--gold); color:var(--gold);}
  .chip.playing{border-color:var(--gold); color:var(--gold); background:#1e1a2e;}
  .tune.playing .name{color:var(--gold);}

  .score{width:var(--colW); margin-bottom:18px;}
  .scoreHead{display:flex; gap:12px; align-items:baseline; margin-bottom:6px;}
  .scoreHead>span:first-child{font-size:13px; color:var(--gold); letter-spacing:1px;
                              flex:none; white-space:nowrap;}
  .scoreHead .hint{margin:0; font-size:11.5px;}
  .scoreStrip{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    height:70px; padding:14px 12px; overflow-x:auto; overflow-y:hidden;
    white-space:nowrap; font-family:Consolas,"Noto Sans Mono",monospace;
    scrollbar-width:thin;
  }
  .modeBtn{margin-left:auto; flex:none; background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:3px 12px; font-size:12px; cursor:pointer;}
  #roll{display:block; width:100%; height:120px; background:var(--panel); border:1px solid var(--line); border-radius:10px;}
  .scoreStrip .empty{color:var(--muted); font-size:13px; font-family:"Noto Sans TC",sans-serif;}
  /* 一顆音一個 span：八度點用 ::before／::after 畫（attr 取內容），不多開節點 */
  .jn{position:relative; display:inline-block; min-width:1.15em; text-align:center;
      font-size:19px; color:var(--text); padding:6px 3px; transition:color .08s;}
  .jn::before{content:attr(data-up); position:absolute; top:-5px; left:0; right:0;
              font-size:11px; line-height:1; color:inherit; opacity:.75;}
  .jn::after{content:attr(data-dn); position:absolute; bottom:-4px; left:0; right:0;
             font-size:11px; line-height:1; color:inherit; opacity:.75;}
  .jn.short{text-decoration:underline; text-underline-offset:5px;}
  .jn.rest{color:var(--muted);}
  .jn.on{color:var(--gold); font-weight:700; text-shadow:0 0 12px rgba(212,169,74,.6);}
  .jn.done{color:var(--muted); opacity:.55;}
  .jn.low{color:#c98a8a;}   /* 低八度以下自己變色——「太低」用看的就找得到 */

  /* 多聲部配樂（v1.15.00）：每軌一列——名稱、音色、音量、M／S */
  .orch{width:var(--colW); margin-top:40px; border-top:1px solid var(--line); padding-top:24px;}
  .orch h2{font-size:18px; color:var(--gold); letter-spacing:1px; margin-bottom:12px;}
  .orchHead{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  .orchHead select,.orchHead button,.trk button{background:var(--panel); color:var(--text); border:1px solid var(--line);
          border-radius:999px; padding:7px 16px; font-size:14px; cursor:pointer; font-family:inherit;}
  #orchPlay{border-color:var(--gold); color:var(--gold); margin-left:auto;}
  .trk{display:grid; grid-template-columns:minmax(90px,1fr) 70px 2fr 40px 40px; gap:10px; align-items:center;
       background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
  .trk .tv{color:var(--muted); font-size:13px;}
  .trk button{padding:6px 0; border-radius:8px;}
  .trk button.on{border-color:var(--gold); color:var(--gold);}
  .trk input{width:100%;}
  @media (max-width:640px){ .trk{grid-template-columns:1fr 1fr 40px 40px;} .trk input{grid-column:1/-1; order:9;} }
  /* 2K（≥1800px）：不准手機骨架搬上桌機——欄寬放到 1640、字級照 2K 通則（內文 18、標題 32）、
     曲目卡一排 5 張、音色鈕一排 9 顆（2026-10-16 Master：「2K 版的版面不要再加寬？」） */
  @media (min-width:1800px) and (min-height:1200px){
    body{padding-top:48px;}
    h1{font-size:40px;} .sub{font-size:18px;}
    .voices{grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px;}
    .voices button{font-size:18px; min-height:52px;}
    .vsep,.hint{font-size:16px;}
    .now{font-size:18px; height:40px;} .now button{font-size:16px; padding:6px 18px;}
    .scoreHead>span:first-child{font-size:16px;} .scoreHead .hint{font-size:14px;} .modeBtn{font-size:14px;}
    #roll{height:200px;}
    .tunes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px;}
    .tune{padding:18px 20px;} .tune .name{font-size:22px;} .tune .orig{font-size:15px;} .tune .meta{font-size:15px;}
    .orch h2{font-size:24px;}
  }
  /* 分頁：曲庫／簡譜即興台／多聲部一次只顯示一個（Master 2026-10-16：「版面如果有空間，就盡量不要出現需要拉動的卷軸」） */
  .tabs{display:flex; gap:8px; width:var(--colW); margin:4px 0 12px;}
  .tabs button{background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:8px 18px; font-size:15px; cursor:pointer; font-family:inherit;}
  .tabs button.on{border-color:var(--gold); color:var(--gold);}
  .tabLink{border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:8px 18px; font-size:15px; text-decoration:none;}
  /* 多聲部分頁：每軌自帶樂器，左欄的音色選擇用不到——收起來免得誤會 */
  body.tab-orch #voices, body.tab-orch .left > .hint, body.tab-orch #mixToggle{display:none;}
  .panel[hidden]{display:none !important;}
  .panel h2{display:none;}            /* 分頁鈕已經寫了名字，不重複 */
  .orch.panel{margin-top:0; border-top:none; padding-top:0;}
  .top{display:flex; flex-direction:column; align-items:center;}
  .app,.left,.right{display:contents;}  /* 窄螢幕：照舊一條直欄往下排 */
  /* 桌機（≥1100px）：左欄選樂器、右欄聽與選曲，整頁一屏不捲動；放不下的只在面板內部捲 */
  @media (min-width:1100px){
    :root{ --colW:100%; }
    body{height:100vh; overflow:hidden; padding:16px 24px 28px; align-items:stretch;}
    .top{flex-direction:row; align-items:baseline; justify-content:center; gap:20px; margin-bottom:14px; flex:none;}
    .top .sub,.top a{margin:0 !important;}
    .app{display:grid; grid-template-columns:minmax(360px,30%) 1fr; gap:28px; flex:1; min-height:0; width:100%; max-width:2400px; margin:0 auto;}
    .left{display:flex; flex-direction:column; gap:8px; overflow:auto; min-height:0;}
    .left .voices{grid-template-columns:repeat(3,1fr); margin:0;}
    .left .hint{margin:4px 0;}
    .left .now{flex-wrap:wrap; height:auto; gap:10px; margin:0;}
    .right{display:flex; flex-direction:column; min-height:0;}
    .right .score{margin-bottom:6px;}
    .right .panel{flex:1; min-height:0; overflow:auto;}
    .tunes{align-content:start;}
    .credits{position:fixed; right:16px; bottom:6px; margin:0;}
  }
</style>
</head>
<body>
  <header class="top">
  <h1 data-t="app.title"></h1>
  <div class="sub" data-t="app.subtitle"></div>
  </header>

  <div class="app">
  <aside class="left">

  <div class="voices" id="voices"></div>
  <div class="hint" data-t="ui.hint"></div>

  <div class="now">
    <button id="modeBtn"></button>
    <span id="nowLabel"></span>
    <button id="stopBtn" data-t="ui.stop" style="display:none"></button>
    <button id="muteBtn" title="靜音"></button>
  </div>
  </aside>

  <main class="right">

  <!-- 簡譜條（v1.11.00，Roy：「播放的時候下面就顯示簡譜」）——也是「音太低」的診斷儀 -->
  <section class="score">
    <div class="scoreHead"><span data-t="score.title"></span><span class="hint" id="scoreHint"></span><button id="scoreMode" class="modeBtn"></button></div>
    <canvas id="roll"></canvas>
    <div class="scoreStrip" id="scoreStrip"></div>
  </section>

  <nav class="tabs">
    <button data-p="tunes" data-t="tab.tunes"></button><button data-p="orch" data-t="orch.title"></button><a class="tabLink" href="composer.html" data-t="tab.create"></a>
  </nav>
  <div class="tunes panel" data-p="tunes" id="tunes"></div>

  <!-- 簡譜即興台（v1.10.00，Roy：「3.1415926，圓周率當樂譜！我想要輸入簡譜就能發音」） -->

  <!-- 多聲部配樂（v1.15.00，Master 的史詩配樂）：曲庫在 config.js 的 ORCH_TUNES -->
  <section class="orch panel" data-p="orch">
    <h2 data-t="orch.title"></h2>
    <div class="orchHead">
      <select id="orchSel"></select>
      <button id="orchEdit" data-t="orch.edit"></button>
      <button id="orchStop" data-t="ui.stop"></button>
      <button id="orchPlay" data-t="orch.play"></button>
    </div>
    <div id="trks"></div>
    <div class="hint" data-t="orch.hint"></div>
  </section>

  </main>
  </div>

  <footer class="credits"><a href="https://versilian-studios.com/vsco-community/" target="_blank" rel="noopener" data-t="credits.samples"></a></footer>

<script src="config.js?v=1.21.00"></script>
<script src="strings.zh.js?v=1.21.00"></script>
<script src="musician.js?v=1.21.00"></script>
<script src="designer-panel.js?v=1.21.00"></script>
<script>
applyText(CONFIG); applyStaticText();
const JIANPU_IDX=-2;   // 簡譜即興台的虛擬曲目索引（不在 TUNES 裡）

/* 音色雙模式（v1.09.00，Roy：「允許玩家完全不選。也許在音色右邊做個切換開關？」）：
   指揮關（預設）＝單選——點哪個換哪個，快速比音色；
   指揮開＝自由編制（同旋律 doubling），可以全部關掉＝靜場（指揮的休止手勢XD）。
   播放中改編制立刻生效。「指揮／混音師」職稱由 Roy 正名 2026-09-16 */
let activeVoices=new Set(['piano']), playingIdx=-1, mixMode=false;   // 玩家預設鋼琴版（Roy 定案 2026-09-16）

Musician.setSamples(SAMPLES,'samples/vsco/');   // 真樂器取樣：註冊成音色，第一次用到才下載
const voicesEl=document.getElementById('voices');
let realSep=false;
{ const d=document.createElement('div'); d.className='vsep'; d.textContent=TEXT['ui.synthGroup']; voicesEl.appendChild(d); }
Musician.voices.forEach(v=>{
  if(Musician.isSampled(v)&&!realSep){ realSep=true; const d=document.createElement('div'); d.className='vsep'; d.textContent=TEXT['ui.realGroup']; voicesEl.appendChild(d); }
  const b=document.createElement('button');
  b.textContent=TEXT['ui.voice.'+v]; b.dataset.v=v;
  if(activeVoices.has(v))b.classList.add('active');
  b.onclick=()=>{
    if(mixMode){ activeVoices.has(v)?activeVoices.delete(v):activeVoices.add(v); }
    else activeVoices=new Set([v]);
    paintVoices();
    if(playingIdx>=0||playingIdx===JIANPU_IDX)playTune(playingIdx);
  };
  voicesEl.appendChild(b);
});
const mixBtn=document.createElement('button');
mixBtn.id='mixToggle'; mixBtn.textContent=TEXT['ui.mix'];
mixBtn.onclick=()=>{
  mixMode=!mixMode;
  if(!mixMode && activeVoices.size!==1)   // 收回單選：留最左邊亮著的那顆；全暗就回預設鋼琴
    activeVoices=new Set([Musician.voices.find(v=>activeVoices.has(v))||'piano']);
  paintVoices();
  if(playingIdx>=0||playingIdx===JIANPU_IDX)playTune(playingIdx);
};
document.querySelector('.now').prepend(mixBtn);   // 指揮開關跟播放模式放同一列（它是「怎麼播」不是「哪種音色」）
function paintVoices(){
  voicesEl.querySelectorAll('button').forEach(x=>{
    if(x.id==='mixToggle') x.classList.toggle('mixOn',mixMode);
    else x.classList.toggle('active',activeVoices.has(x.dataset.v));
  });
}
paintVoices();

const tunesEl=document.getElementById('tunes'),
      nowEl=document.getElementById('nowLabel'),
      stopBtn=document.getElementById('stopBtn');
/* 依原文曲名字母排序（Roy 定案 2026-09-15）。康康舞的原名刻意寫成
   「Orphée aux enfers: Ouverture — Galop infernal」——與序曲同前綴、字串較長，
   排序天然落在序曲正後方，不需要特例；名字本身就說明了它是序曲的壓軸段。
   帶 parent 的曲目（Roy 定案：「變奏版這種按鈕跟著原曲」）不佔卡位，
   變成掛在原曲卡下緣的小膠囊鍵——卡片點了播原版，膠囊點了播變奏 */
const CARD_BY_TUNE={};   // TUNES index → 它顯示在哪張卡（變奏映到原曲卡）
TUNES.map((tu,i)=>({tu,i}))
  .filter(x=>!x.tu.parent)
  .sort((a,b)=>(a.tu.orig||a.tu.name).localeCompare(b.tu.orig||b.tu.name))
  .forEach(({tu,i})=>{
  const beats=tu.notes.reduce((s,n)=>s+n[1],0);
  const b=document.createElement('div');
  b.className='tune'; b.dataset.i=i; CARD_BY_TUNE[i]=b;
  b.innerHTML='<span class="name">'+tu.name+'</span>'+
              (tu.orig?'<span class="orig">'+tu.orig+'</span>':'')+
              '<span class="meta">'+tu.composer+'　'+TEXT['ui.beats'](beats)+'</span>';
  b.onclick=()=>playTune(i);
  const kids=TUNES.map((t2,j)=>({t2,j})).filter(x=>x.t2.parent===tu.id);
  if(kids.length){
    const row=document.createElement('div'); row.className='chips';
    kids.forEach(({t2,j})=>{
      CARD_BY_TUNE[j]=b;
      const c=document.createElement('button'); c.className='chip'; c.textContent=t2.label||t2.name;
      c.dataset.j=j;
      c.onclick=e=>{e.stopPropagation(); playTune(j);};   // 卡片本體是原版，膠囊是變奏
      row.appendChild(c);
    });
    b.appendChild(row);
  }
  tunesEl.appendChild(b);
});

/* ── 簡譜條（v1.11.00，Roy：「播放的時候下面就顯示簡譜」）──────────
   renderScore() 把 tune 轉成一排 span（一顆音一個節點，八度點走 CSS ::before/::after
   的 attr()，2600 音的小夜曲也只有 2600 個節點）；tickScore() 每幀問引擎播到第幾秒，
   只動「上一顆」與「這一顆」兩個 class，不重畫整條。
   低八度以下的音自己染紅——Roy：「有些音色似乎太低」，這樣就看得到是哪幾顆 */
const stripEl=document.getElementById('scoreStrip'), scoreHintEl=document.getElementById('scoreHint');
let scoreTokens=[], scoreNodes=[], scoreOn=-1, scoreRAF=0;
function clearScore(msg){
  cancelAnimationFrame(scoreRAF); scoreRAF=0;
  scoreTokens=[]; scoreNodes=[]; scoreOn=-1;
  stripEl.innerHTML='<span class="empty"></span>';
  stripEl.firstChild.textContent=msg||TEXT['score.empty'];
  scoreHintEl.textContent='';
  drawRoll(0);
}
function renderScore(tune){
  const jp=Musician.toJianpu(tune,{floorMidi:CONFIG.play.floorMidi});
  scoreTokens=jp.tokens; scoreOn=-1;
  const frag=document.createDocumentFragment();
  const dots=n=>'˙'.repeat(Math.min(Math.abs(n),3));
  for(const t of jp.tokens){
    const el=document.createElement('span');
    el.className='jn'+(t.d==='0'?' rest':'')+(t.beats<1?' short':'')+(t.oct<0?' low':'');
    if(t.oct>0) el.dataset.up=dots(t.oct);
    if(t.oct<0) el.dataset.dn=dots(t.oct);
    // 兩拍以上補簡譜的延長線（最多三根，長音不佔滿整條）
    el.textContent=t.acc+t.d+(t.beats>=2?' –'.repeat(Math.min(Math.round(t.beats)-1,3)):'');
    frag.appendChild(el);
  }
  stripEl.innerHTML=''; stripEl.appendChild(frag);
  scoreNodes=[...stripEl.children];
  stripEl.scrollLeft=0;
  const lows=jp.tokens.filter(t=>t.d!=='0'&&t.oct<0).length;
  scoreHintEl.textContent=TEXT['score.hint']+(lows?'　｜　這首有 '+lows+' 顆低八度音（紅色）':'');
  if(!scoreRAF) scoreRAF=requestAnimationFrame(tickScore);
}

/* ── 長條圖模式（Roy：「簡譜有沒有可能用長條圖顯示音高，然後會隨著音樂明滅？」）──
   橫軸＝時間（固定視窗 8 秒，播放線在左 1/4 處、畫面往左流），縱軸＝音高，一顆音一條長條；
   還沒到的＝藍、正在響的＝金色發光、剛響完＝金色淡出、已過＝暗。與簡譜條共用同一份 tokens／同一個 rAF。 */
const rollEl=document.getElementById('roll'), rctx=rollEl.getContext('2d');
let rollMode=true; try{ rollMode=localStorage.getItem('musician.scoreMode')!=='jp'; }catch(e){}
const scoreModeBtn=document.getElementById('scoreMode');
function applyMode(){
  rollEl.style.display=rollMode?'block':'none'; stripEl.style.display=rollMode?'none':'block';
  scoreModeBtn.textContent=rollMode?'改看簡譜':'改看長條圖';
  try{ localStorage.setItem('musician.scoreMode',rollMode?'bar':'jp'); }catch(e){}
  drawRoll(Math.max(0,Musician.position()));
}
scoreModeBtn.onclick=()=>{ rollMode=!rollMode; applyMode(); if(!scoreRAF&&scoreTokens.length&&Musician.position()>=0) scoreRAF=requestAnimationFrame(tickScore); };
function drawRoll(pos){
  if(!rollMode) return;
  const dpr=window.devicePixelRatio||1, W=rollEl.clientWidth, H=rollEl.clientHeight;
  if(rollEl.width!==Math.round(W*dpr)){ rollEl.width=Math.round(W*dpr); rollEl.height=Math.round(H*dpr); }
  rctx.setTransform(dpr,0,0,dpr,0,0); rctx.clearRect(0,0,W,H);
  const toks=scoreTokens;
  if(!toks.length){ rctx.fillStyle='#8a8fa8'; rctx.font='15px "Noto Sans TC",sans-serif'; rctx.textAlign='center';
    rctx.fillText(TEXT['score.empty'],W/2,H/2+5); rctx.textAlign='left'; return; }
  let lo=1e9, hi=-1e9; for(const t of toks) if(t.midi!=null){ if(t.midi<lo)lo=t.midi; if(t.midi>hi)hi=t.midi; }
  if(lo>hi) return;
  const WIN=8, pps=W/WIN, x0=W*0.25, padY=10, rows=hi-lo+1, rh=Math.max(3,(H-2*padY)/rows);
  // 找第一顆還看得到的音（tokens 依 sec 排序）
  let a=0,b=toks.length; while(a<b){ const m=(a+b)>>1; if(toks[m].sec+toks[m].dur<pos-0.6) a=m+1; else b=m; }
  for(let i=a;i<toks.length;i++){
    const t=toks[i], x=x0+(t.sec-pos)*pps; if(x>W) break;
    if(t.midi==null) continue;
    const w=Math.max(3,t.dur*pps-2), y=H-padY-(t.midi-lo+1)*rh+1, end=t.sec+t.dur;
    if(pos>=t.sec && pos<end){ rctx.fillStyle='#ffd77a'; rctx.shadowColor='rgba(255,200,80,.9)'; rctx.shadowBlur=14; }
    else if(pos>=end){ const f=Math.max(0,1-(pos-end)/0.5);          // 剛響完：0.5 秒淡出
      rctx.shadowBlur=f>0?10*f:0; rctx.shadowColor='rgba(255,200,80,.7)';
      rctx.fillStyle=f>0?`rgba(212,169,74,${0.25+0.6*f})`:'rgba(138,143,168,.28)'; }
    else { rctx.shadowBlur=0; rctx.fillStyle='rgba(126,167,216,.7)'; }
    rctx.fillRect(x,y,w,Math.max(2,rh-2));
  }
  rctx.shadowBlur=0; rctx.fillStyle='rgba(232,228,216,.5)'; rctx.fillRect(x0-1,0,2,H);   // 播放線
}
function tickScore(){
  scoreRAF=0;
  const pos=Musician.position();
  drawRoll(pos<0?0:pos);
  if(pos<0){ if(scoreOn>=0&&scoreNodes[scoreOn]) scoreNodes[scoreOn].classList.remove('on'); scoreOn=-1; return; }
  let i=(scoreOn>=0&&scoreTokens[scoreOn]&&pos>=scoreTokens[scoreOn].sec)?scoreOn:0;
  while(i+1<scoreTokens.length && scoreTokens[i+1].sec<=pos) i++;   // 從上次位置往前走，不必每幀搜整首
  if(i!==scoreOn){
    if(scoreOn>=0&&scoreNodes[scoreOn]){ scoreNodes[scoreOn].classList.remove('on'); scoreNodes[scoreOn].classList.add('done'); }
    const el=scoreNodes[i];
    if(el){
      el.classList.add('on'); el.classList.remove('done');
      const r=el.offsetLeft-stripEl.scrollLeft;          // 快到右緣就把它拉回三分之一處
      if(r>stripEl.clientWidth*0.75||r<0) stripEl.scrollLeft=el.offsetLeft-stripEl.clientWidth*0.33;
    }
    scoreOn=i;
  }
  scoreRAF=requestAnimationFrame(tickScore);
}
/* 分頁隱藏時瀏覽器不跑 rAF；回到前景要自己接回去（否則簡譜停在離開時那一顆） */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && scoreTokens.length && Musician.position()>=0 && !scoreRAF)
    scoreRAF=requestAnimationFrame(tickScore);
});

function mark(i){
  playingIdx=i;
  /* v1.09.01 顯示歧義修正（Roy：「長笛版跳到小星星，但出來的不是小星星」——
     隨機抽到變奏曲時亮的是母卡，看起來像在播原版）：
     播原版＝卡片發光；播變奏＝只有那顆膠囊發光，卡片本體不亮 */
  const isVariant=i>=0&&TUNES[i].parent;
  const card=i>=0&&!isVariant?CARD_BY_TUNE[i]:null;
  tunesEl.querySelectorAll('.tune').forEach(x=>x.classList.toggle('playing',x===card));
  tunesEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('playing',isVariant&&+x.dataset.j===i));
  nowEl.textContent=i>=0?TEXT['ui.playing'](TUNES[i].name):'';
  stopBtn.style.display=i>=0?'':'none';
}
/* 播放模式（v1.09.00，Roy：「還有循環播放，單曲播放，隨機播放。嗯？這就是音樂播放器嘛。」）：
   單曲＝播完停；循環＝同一首重來；隨機＝洗牌袋輪播全庫（含變奏，一輪不重複、不跨輪連莊——
   Math-Racer 換曲的同一個形狀）。曲終才看模式，手點永遠直接播 */
const MODES=['single','loop','shuffle'];
let playMode='single', shuffleBag=[];
const modeBtn=document.getElementById('modeBtn');
function paintMode(){ modeBtn.textContent=TEXT['ui.mode.'+playMode]; }
modeBtn.onclick=()=>{ playMode=MODES[(MODES.indexOf(playMode)+1)%MODES.length]; paintMode(); };
paintMode();
function nextShuffle(){
  if(!shuffleBag.length){
    shuffleBag=TUNES.map((_,i)=>i);
    for(let i=shuffleBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffleBag[i],shuffleBag[j]]=[shuffleBag[j],shuffleBag[i]];}
    if(shuffleBag.length>1&&shuffleBag[shuffleBag.length-1]===playingIdx)
      [shuffleBag[shuffleBag.length-1],shuffleBag[0]]=[shuffleBag[0],shuffleBag[shuffleBag.length-1]];
  }
  return shuffleBag.pop();
}
function handleEnd(i){
  if(playMode==='loop') playTune(i);
  else if(playMode==='shuffle') playTune(nextShuffle());
  else mark(-1);
}
function playLibrary(i){
  if(!activeVoices.size){ Musician.stop(); mark(-1); clearScore(); return; }   // 全關＝靜場
  Musician.play(TUNES[i],{voice:[...activeVoices],cfg:CONFIG,onend:()=>handleEnd(i)});
  mark(i); renderScore(TUNES[i]);
}
stopBtn.onclick=()=>{Musician.stop();mark(-1);clearScore();};

/* 靜音鈕（v1.13.00）：狀態記在 localStorage，鍵名帶專案名不跟別款打架。
   走引擎的常駐靜音閘，所以播放中按下去立刻沒聲音，不必等這首放完 */
const MUTE_KEY='musician.muted';
const muteBtn=document.getElementById('muteBtn');
let uiMuted=false; try{ uiMuted=localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}
function paintMute(){
  muteBtn.textContent=uiMuted?'🔇':'🔊';
  muteBtn.classList.toggle('off',uiMuted);
}
muteBtn.onclick=()=>{
  uiMuted=!uiMuted;
  Musician.setMuted(uiMuted);
  try{ localStorage.setItem(MUTE_KEY, uiMuted?'1':'0'); }catch(e){}
  paintMute();
};
paintMute();
if(uiMuted) Musician.setMuted(true);   // 重整後沿用上次的選擇

clearScore();   // 開頁先給一句提示，不要空白框
applyMode();
// 播放中換音色／拉面板／循環時，索引是即興台就重播它，否則走曲庫
function playTune(i){ return playLibrary(i); }   // 簡譜即興台已併入積木編輯器（2026-10-16）

/* 混音師面板（v1.08.01 全開放；v1.09.00 正名，Roy：「我稱為混音的其實是指揮家，
   指揮家面板其實是混音師面板XD」——選樂器上場＝指揮（音色列的「指揮」開關），
   調音量泛音回聲＝混音師（本面板）。gate:false＝人人可開：旋鈕全是音色演奏參數，
   調壞 F5 復原，無成績可作弊。機制仍是共用面板 v11 的 opts.title */
initDesignerPanel(CONFIG,{
  gate:false, title:'混音師面板',
  labels:{
    play:'播放', volume:'總音量', bpm:'預設速度', chords:'和聲襯底', chordBars:'幾拍換和弦', transpose:'移調半音', floorMidi:'低音折疊(MIDI)',
    voices:'音色', chip:'8-bit', crystal:'水晶', piano:'鋼琴', strings:'弦樂', flute:'長笛', brass:'銅管', choir:'合唱', timpani:'定音鼓', harp:'豎琴', shamisen:'三味線', guzheng:'古箏', r_vln:'真·小提琴', r_cello:'真·大提琴', r_trem:'真·弦樂顫音', r_tbn:'真·長號', r_tuba:'真·低音號', r_tpt:'真·小號', r_flute:'真·長笛', r_oboe:'真·雙簧管', r_bsn:'真·低音管', r_harp:'真·豎琴', r_mar:'真·馬林巴', r_glock:'真·鐵琴', r_perc:'真·打擊組', sawari:'嗡嗡震', bachi:'撥子聲', vibDelay:'揉弦延遲秒',
    bright:'亮度倍數', vowel1:'母音共振峰1', vowel2:'母音共振峰2', drop:'起擊音高倍數', dropTime:'滑音秒', decay:'餘響秒', thump:'槌擊噪音',
    release:'收音秒', detune:'失諧音分', brightness:'亮度倍數', woody:'木頭味',
    vibRate:'顫音頻率', vibDepth:'顫音深度', rootOct:'根音八度',
    gain:'音量', attack:'起音秒', cut:'音長比例', main:'主體', shimmer:'高八度泛音',
    oct:'上移八度數', sparkle:'鐘鳴泛音', ring:'餘韻倍數', padScale:'襯底比例',
    echoTime:'回聲間隔秒', echoFb:'回聲回授', echoMix:'回聲比例',
    h1:'基音', h2:'二倍泛音', h3:'三倍泛音', h4:'四倍泛音',
    chord:'和聲參數', root:'根音', triad:'和弦音',
  },
  theme:{ bg:'#12152a', text:'#e8e4d8', accent:'#d4a94a', accent2:'#7ea7d8',
          field:'#1a1e38', line:'#2a2f52', muted:'#8a8fa8', danger:'#c05555' },
  /* 音色參數改了要重按才聽得到（整首是預先排程的）——播放中就自動重按同一首 */
  onChange:()=>{ if(playingIdx>=0||playingIdx===JIANPU_IDX)playTune(playingIdx); },
});
/* 面板把手 ⚙ 預設浮在左下角，手機／平板會蓋到曲目卡（測試團隊版面大臣 2026-10-04）。
   搬進「正在播放」那一列，跟模式、靜音鈕排在一起，不再浮在內容上。 */
{ const h = document.getElementById('dp-handle'), row = document.querySelector('.now');
  if (h && row) { Object.assign(h.style, { position: 'static', left: 'auto', bottom: 'auto', flex: 'none' }); row.appendChild(h); } }

/* 多聲部配樂：軌的靜音／獨奏／音量改的是 tune.parts 上的狀態（下次播放也記得），
   播放中同時呼叫 Musician.setPart 即時生效 */
{ const sel=document.getElementById('orchSel'), box=document.getElementById('trks');
  ORCH_TUNES.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.name; sel.appendChild(o); });
  const cur=()=>ORCH_TUNES[+sel.value];
  const draw=()=>{
    box.innerHTML='';
    cur().parts.forEach((p,i)=>{
      const r=document.createElement('div'); r.className='trk';
      const vol=p.vol==null?1:p.vol;
      r.innerHTML='<span>'+p.name+'</span><span class="tv">'+TEXT['ui.voice.'+p.voice]+'</span>'+
        '<input type="range" min="0" max="1" step="0.05" value="'+vol+'">'+
        '<button data-k="mute" class="'+(p.mute?'on':'')+'">M</button><button data-k="solo" class="'+(p.solo?'on':'')+'">S</button>';
      r.querySelector('input').oninput=e=>{ p.vol=+e.target.value; Musician.setPart(i,{vol:p.vol}); };
      r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        p[b.dataset.k]=!p[b.dataset.k]; b.classList.toggle('on',p[b.dataset.k]);
        Musician.setPart(i,{[b.dataset.k]:p[b.dataset.k]});
        if(b.dataset.k==='solo') box.querySelectorAll('[data-k=solo]').forEach((x,j)=>{ Musician.setPart(j,{solo:cur().parts[j].solo}); });
      });
      box.appendChild(r);
    });
  };
  sel.onchange=draw; draw();
  document.getElementById('orchPlay').onclick=()=>Musician.play(cur(),{cfg:CONFIG});
  document.getElementById('orchStop').onclick=()=>Musician.stop();
  // 拆開來改：把這首交給積木編輯器（localStorage 傳遞），在那邊能放進格子的軌變格子，放不進的保留簡譜軌
  document.getElementById('orchEdit').onclick=()=>{
    try{ localStorage.setItem('composer.import', JSON.stringify(cur())); }catch(e){}
    location.href='composer.html?import=1';
  };
}
/* 分頁切換（記住上次看哪一頁） */
{ const btns=[...document.querySelectorAll('.tabs button')], panels=[...document.querySelectorAll('.panel')];
  const show=k=>{ btns.forEach(b=>b.classList.toggle('on',b.dataset.p===k)); panels.forEach(p=>p.hidden=p.dataset.p!==k);
    document.body.classList.toggle('tab-orch',k==='orch');
    try{ localStorage.setItem('musician.tab',k); }catch(e){} };
  btns.forEach(b=>b.onclick=()=>show(b.dataset.p));
  let k='tunes'; try{ k=localStorage.getItem('musician.tab')||'tunes'; }catch(e){}
  show(btns.some(b=>b.dataset.p===k)?k:'tunes'); }
</script>
