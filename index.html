<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Musician 音樂家</title>
<link rel="stylesheet" href="musician-theme.css?v=1.26.00">
<script src="musician-shell.js?v=1.26.00"></script>
<style>
  /* 聽（欣賞）頁骨架（改版提案階段 2，2026-11-02）：舞台在左、曲庫在右；手機由上到下同一順序。
     色票在 musician-theme.css，這裡只寫版面。 */
  :root{ --laneH:clamp(120px,17vh,220px); }
  body{height:100dvh; display:flex; flex-direction:column; padding:14px 28px 20px; overflow:hidden;}
  .mtop{flex:none; margin-bottom:12px;}
  .app{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(340px,30vw,460px); gap:14px 24px; width:100%; max-width:2400px; margin:0 auto;}
  .stagecol{display:flex; flex-direction:column; gap:10px; min-height:0;}

  .nowrow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; min-height:34px; flex:none;}
  .nowname{font-size:24px; color:var(--gold); font-weight:700;}
  .noworig{font-size:15px; color:var(--blue); font-style:italic;}

  /* 舞台：捲簾高度＝軌數×每軌高（寬扁，不拉成高塔）；單旋律下面接簡譜全文，吃掉剩下的高度 */
  .stage{flex:0 1 calc(var(--lanes,1) * var(--laneH)); min-height:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr);
         background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .stage:not(.multi){flex-basis:clamp(160px,30vh,340px);}   /* 單旋律：捲簾寬扁，剩下的高度給下面的簡譜全文 */
  #roll{display:block; width:100%; height:100%; min-width:0;}
  .lanectl{display:none; flex-direction:column; border-right:1px solid var(--line); width:clamp(150px,16vw,240px);}
  .stage.multi{grid-template-columns:auto minmax(0,1fr);}
  .stage.multi .lanectl{display:flex;}
  .lc{flex:1; min-height:0; display:grid; grid-template-columns:1fr auto auto; grid-template-rows:auto 1fr; gap:2px 6px; align-items:center;
      padding:6px 10px; border-bottom:1px solid var(--line);}
  .lc:last-child{border-bottom:none;}
  .lc .nm{grid-column:1/-1; font-size:15px; display:flex; gap:8px; align-items:baseline; min-width:0;}
  .lc .nm b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .lc .nm i{font-style:normal; color:var(--muted); font-size:13px; white-space:nowrap;}
  .lc input[type=range]{width:100%; min-width:40px; accent-color:var(--gold);}
  .lc button{background:var(--panel2); border:1px solid var(--line); border-radius:8px; min-width:44px; min-height:36px; cursor:pointer; color:var(--muted);}
  .lc button.on{border-color:var(--gold); color:var(--gold);}
  .scoreStrip{flex:1; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; overflow-y:auto; position:relative;
              display:flex; flex-wrap:wrap; align-content:flex-start; gap:2px 0; font-family:Consolas,"Noto Sans Mono",monospace;}
  .stagecol.multi .scoreStrip{display:none;}
  /* 一顆音一個 span：八度點用 ::before／::after 畫（attr 取內容），不多開節點 */
  .jn{position:relative; display:inline-block; min-width:1.15em; text-align:center; font-size:clamp(22px,1.9vw,38px); color:var(--text); padding:10px 4px; transition:color .08s;}
  .jn::before{content:attr(data-up); position:absolute; top:-3px; left:0; right:0; font-size:12px; line-height:1; color:inherit; opacity:.75;}
  .jn::after{content:attr(data-dn); position:absolute; bottom:-2px; left:0; right:0; font-size:12px; line-height:1; color:inherit; opacity:.75;}
  .jn.short{text-decoration:underline; text-underline-offset:5px;}
  .jn.rest{color:var(--muted);}
  .jn.on{color:var(--gold); font-weight:700; text-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent);}
  .jn.done{color:var(--muted); opacity:.55;}
  .jn.low{color:#c98a8a;}   /* 低八度以下自己變色——「太低」用看的就找得到 */

  /* 控制列：播放／模式／音色／靜音／混音師面板把手 */
  .ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:relative; flex:none;}
  .ctl button{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:0 16px; min-height:44px; cursor:pointer; font-size:16px; color:var(--text);}
  .ctl button:hover{border-color:var(--blue);}
  .ctl .big{background:var(--gold); border-color:var(--gold); color:#1a1405; font-weight:700; padding:0 28px; min-width:96px;}
  .ctl #muteBtn.off{color:var(--gold); border-color:var(--gold);}
  .ctl.orch #voiceBtn{display:none;} .ctl #editBtn{display:none;} .ctl.orch #editBtn{display:inline-flex; align-items:center;}
  .ctl #dp-handle{margin-left:auto;}
  #voicePop{position:absolute; left:0; bottom:calc(100% + 8px); z-index:30; width:min(620px,94vw); max-height:min(60vh,520px); overflow:auto;
            background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #voicePop[hidden]{display:none;}
  .voices{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px;}
  .voices button{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:0 4px; font-size:15px; cursor:pointer; white-space:nowrap; min-height:44px;}
  .voices button.active{border-color:var(--gold); color:var(--gold);}
  .vsep{grid-column:1/-1; color:var(--muted); font-size:13px; margin-top:6px;} .vsep:first-child{margin-top:0;}
  .popfoot{display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .popfoot button{background:var(--panel2); border:1px solid var(--line); border-radius:10px; min-height:44px; padding:0 16px; cursor:pointer; color:var(--text);}
  .popfoot button.mixOn{border-color:var(--blue); color:var(--blue);}

  /* 曲庫側欄：舞台在左、清單在右，內部捲動 */
  .side{display:flex; flex-direction:column; gap:10px; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; overflow:auto;}
  .sec{color:var(--muted); font-size:14px; margin:6px 2px 0; letter-spacing:1px;} .sec:first-child{margin-top:0;}
  .tune{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; text-align:left; color:var(--text);
        display:flex; flex-direction:column; gap:2px; font-family:inherit; flex:none;}
  .tune:hover{border-color:var(--blue);}
  .tune.sel{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));}
  .tune.playing{border-color:var(--gold); background:var(--sel);}
  .tune .name{font-size:18px;} .tune.playing .name{color:var(--gold);}
  .tune .meta{font-size:14px; color:var(--muted);}
  .chips{display:flex; gap:6px; margin-top:6px;}
  .chip{font-size:13px; padding:4px 14px; min-height:32px; border:1px solid var(--line); border-radius:999px; background:none; color:var(--blue); cursor:pointer; font-family:inherit;}
  .chip:hover{border-color:var(--gold); color:var(--gold);} .chip.playing{border-color:var(--gold); color:var(--gold); background:var(--sel);}
  .credits{position:fixed; right:16px; bottom:4px; font-size:12px;} .credits a{color:var(--muted);}

  /* 手機：舞台在最上、播放列、曲庫內部捲——第一眼就是「點一首曲子」 */
  @media (max-width:1099px){
    :root{ --laneH:clamp(72px,12vh,120px); }
    body{padding:10px 12px 0;}
    .app{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:8px;}
    .stage,.stage:not(.multi){flex:0 1 calc(var(--lanes,1) * var(--laneH)); max-height:44vh;}
    .scoreStrip{display:none;}
    .nowname{font-size:19px;} .noworig{display:none;}
    .lanectl{width:96px;} .lc input[type=range]{display:none;} .lc{grid-template-columns:1fr auto auto; padding:4px 6px;} .lc .nm i{display:none;}
    .ctl .big{min-width:64px; padding:0 18px;}
    .credits{position:static; text-align:center; font-size:10px; padding:2px 0;}
    .lc button{min-width:36px; min-height:40px;}
    #voicePop{position:fixed; left:8px; right:8px; bottom:8px; top:auto; width:auto; max-height:70dvh;}   /* 手機：音色選單做成貼底的面板，不管播放列在哪都看得到 */
  }
  @media (min-width:1800px) and (min-height:1200px){
    .nowname{font-size:30px;} .tune .name{font-size:22px;} .tune .meta{font-size:16px;} .jn{font-size:26px;}
    .ctl button{font-size:18px;}
  }
</style>
</head>
<body>
  <header class="mtop"><h1 data-t="app.title"></h1><span id="mnav" data-page="listen"></span></header>

  <div class="app" id="app">
    <main class="stagecol" id="stagecol">
      <div class="nowrow"><span class="nowname" id="nowName"></span><span class="noworig" id="nowOrig"></span></div>
      <section class="stage" id="stage">
        <div class="lanectl" id="lanectl"></div>
        <canvas id="roll"></canvas>
      </section>
      <div class="scoreStrip" id="scoreStrip"></div>
      <div class="ctl" id="ctl">
        <button id="playBtn" class="big">▶</button>
        <button id="modeBtn"></button>
        <button id="voiceBtn"></button>
        <button id="editBtn" data-t="orch.edit"></button>
        <button id="muteBtn" title="靜音"></button>
        <div id="voicePop" hidden>
          <div class="voices" id="voices"></div>
          <div class="popfoot" id="popfoot"></div>
        </div>
      </div>
    </main>
    <aside class="side" id="tunes"></aside>
  </div>

  <footer class="credits"><a href="https://versilian-studios.com/vsco-community/" target="_blank" rel="noopener" data-t="credits.samples"></a></footer>

<script src="config.js?v=1.26.00"></script>
<script src="strings.zh.js?v=1.26.00"></script>
<script src="musician.js?v=1.26.00"></script>
<script src="designer-panel.js?v=1.26.00"></script>
<script>
applyText(CONFIG); applyStaticText();
const $=id=>document.getElementById(id);
const stageEl=$('stage'), stagecol=$('stagecol'), ctl=$('ctl'), tunesEl=$('tunes');

/* 音色雙模式（v1.09.00，Roy：「允許玩家完全不選。也許在音色右邊做個切換開關？」）：
   指揮關（預設）＝單選——點哪個換哪個，快速比音色；
   指揮開＝自由編制（同旋律 doubling），可以全部關掉＝靜場。播放中改編制立刻生效。 */
let activeVoices=new Set(['piano']), mixMode=false;   // 玩家預設鋼琴版（Roy 定案 2026-09-16）
let sel=null, playingNow=false;                        // sel＝{k:'t'|'o', i}：選中的曲；playingNow＝正在播

Musician.setSamples(SAMPLES,'samples/vsco/');   // 真樂器取樣：註冊成音色，第一次用到才下載
const voicesEl=$('voices');
{ let realSep=false;
  const sep=t=>{ const d=document.createElement('div'); d.className='vsep'; d.textContent=t; voicesEl.appendChild(d); };
  sep(TEXT['ui.synthGroup']);
  Musician.voices.forEach(v=>{
    if(Musician.isSampled(v)&&!realSep){ realSep=true; sep(TEXT['ui.realGroup']); }
    const b=document.createElement('button');
    b.textContent=TEXT['ui.voice.'+v]; b.dataset.v=v;
    b.onclick=()=>{
      if(mixMode){ activeVoices.has(v)?activeVoices.delete(v):activeVoices.add(v); }
      else { activeVoices=new Set([v]); $('voicePop').hidden=true; }
      paintVoices(); if(playingNow&&sel.k==='t') playSel();
    };
    voicesEl.appendChild(b);
  }); }
const mixBtn=document.createElement('button'); mixBtn.id='mixToggle'; mixBtn.textContent=TEXT['ui.mix'];
mixBtn.onclick=()=>{
  mixMode=!mixMode;
  if(!mixMode && activeVoices.size!==1)   // 收回單選：留最左邊亮著的那顆；全暗就回預設鋼琴
    activeVoices=new Set([Musician.voices.find(v=>activeVoices.has(v))||'piano']);
  paintVoices(); if(playingNow&&sel.k==='t') playSel();
};
/* 伴奏開關（v1.23.00）：有伴奏軌的曲子，旋律照選的音色、伴奏固定樂器；關掉回到單旋律（辨認遊戲的原味） */
let accOn=true; try{ accOn=localStorage.getItem('musician.acc')!=='0'; }catch(e){}
const accBtn=document.createElement('button'); accBtn.id='accToggle';
const paintAcc=()=>{ accBtn.textContent=TEXT[accOn?'ui.accOn':'ui.accOff']; accBtn.classList.toggle('mixOn',accOn); };
accBtn.onclick=()=>{ accOn=!accOn; paintAcc(); try{ localStorage.setItem('musician.acc',accOn?'1':'0'); }catch(e){} if(playingNow&&sel.k==='t') playSel(); };
$('popfoot').append(mixBtn,accBtn); paintAcc();
function paintVoices(){
  voicesEl.querySelectorAll('button').forEach(x=>x.classList.toggle('active',activeVoices.has(x.dataset.v)));
  mixBtn.classList.toggle('mixOn',mixMode);
  const n=activeVoices.size, v=[...activeVoices][0];
  $('voiceBtn').textContent='♪ '+(n===0?'靜場':n===1?TEXT['ui.voice.'+v]:n+' 種音色')+' ▾';
}
paintVoices();
$('voiceBtn').onclick=e=>{ e.stopPropagation(); $('voicePop').hidden=!$('voicePop').hidden; };
document.addEventListener('click',e=>{ if(!$('voicePop').hidden&&!$('voicePop').contains(e.target)) $('voicePop').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('voicePop').hidden=true; });

/* ── 曲庫側欄：古典名曲（TUNES）與多聲部配樂（ORCH_TUNES）同一份清單，分兩節 ──
   依原文曲名字母排序（Roy 定案 2026-09-15）；帶 parent 的變奏掛在原曲卡下緣當膠囊（Roy：「變奏版這種按鈕跟著原曲」） */
const CARD={};   // 'tN'／'oN' → 卡片節點（變奏映到原曲卡）
const secHead=t=>{ const d=document.createElement('div'); d.className='sec'; d.textContent=t; tunesEl.appendChild(d); };
function addCard(key,name,meta,onclick){
  const b=document.createElement('div'); b.className='tune'; b.dataset.k=key; CARD[key]=b;
  b.innerHTML='<span class="name">'+name+'</span><span class="meta">'+meta+'</span>';
  b.setAttribute('role','button'); b.tabIndex=0; b.onclick=onclick;
  b.onkeydown=e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===b){ e.preventDefault(); onclick(); } };
  tunesEl.appendChild(b); return b;
}
secHead('古典名曲');
TUNES.map((tu,i)=>({tu,i})).filter(x=>!x.tu.parent)
  .sort((a,b)=>(a.tu.orig||a.tu.name).localeCompare(b.tu.orig||b.tu.name))
  .forEach(({tu,i})=>{
    const beats=tu.notes.reduce((s,n)=>s+n[1],0);
    const b=addCard('t'+i,tu.name,tu.composer+'　'+TEXT['ui.beats'](beats)+(tu.accomp?'　'+TEXT['ui.hasAcc']:''),()=>pick('t',i,true));
    const kids=TUNES.map((t2,j)=>({t2,j})).filter(x=>x.t2.parent===tu.id);
    if(kids.length){
      const row=document.createElement('div'); row.className='chips';
      kids.forEach(({t2,j})=>{
        CARD['t'+j]=b;
        const c=document.createElement('button'); c.className='chip'; c.textContent=t2.label||t2.name; c.dataset.j=j;
        c.onclick=e=>{ e.stopPropagation(); pick('t',j,true); };   // 卡片本體是原版，膠囊是變奏
        row.appendChild(c);
      });
      b.appendChild(row);
    }
  });
secHead('多聲部配樂');
ORCH_TUNES.forEach((t,i)=>addCard('o'+i,t.name,'多聲部　'+t.parts.length+' 軌',()=>pick('o',i,true)));

const tuneOf=s=>s.k==='t'?TUNES[s.i]:ORCH_TUNES[s.i];

/* ── 舞台：每軌一條捲簾（寬扁）；單旋律下面接簡譜全文 ──────────────
   lanes＝[{name,tokens,color}]；畫布像素尺寸由 ResizeObserver 追著 CSS 尺寸走
   （舊版只在「正在畫」時才對齊，沒播放時換分頁／縮放就被 CSS 拉伸，文字變形——2026-11-02 Master 抓到） */
const stripEl=$('scoreStrip'), rollEl=$('roll'), rctx=rollEl.getContext('2d');
let lanes=[], scoreTokens=[], scoreNodes=[], scoreOn=-1, scoreRAF=0;
const pal={}; function readPal(){ const cs=getComputedStyle(document.documentElement); for(const k of ['gold','blue','muted','text','line','lane1','lane2','lane3','lane4','lane5','lane6']) pal[k]=cs.getPropertyValue('--'+k).trim(); }
readPal(); window.addEventListener('musician-palette',()=>{ readPal(); drawRoll(Math.max(0,Musician.position())); });

function clearScore(){
  cancelAnimationFrame(scoreRAF); scoreRAF=0;
  lanes=[]; scoreTokens=[]; scoreNodes=[]; scoreOn=-1; stripEl.innerHTML='';
  stageEl.style.setProperty('--lanes',1); stageEl.classList.remove('multi'); stagecol.classList.remove('multi'); $('lanectl').innerHTML='';
  drawRoll(0);
}
function renderScore(tune){
  const jp=Musician.toJianpu(tune,{floorMidi:CONFIG.play.floorMidi});
  lanes=[{name:tune.name,tokens:jp.tokens,color:null}];
  scoreTokens=jp.tokens; scoreOn=-1;
  stageEl.style.setProperty('--lanes',1); stageEl.classList.remove('multi'); stagecol.classList.remove('multi'); $('lanectl').innerHTML='';
  const frag=document.createDocumentFragment(), dots=n=>'˙'.repeat(Math.min(Math.abs(n),3));
  for(const t of jp.tokens){
    const el=document.createElement('span');
    el.className='jn'+(t.d==='0'?' rest':'')+(t.beats<1?' short':'')+(t.oct<0?' low':'');
    if(t.oct>0) el.dataset.up=dots(t.oct);
    if(t.oct<0) el.dataset.dn=dots(t.oct);
    el.textContent=t.acc+t.d+(t.beats>=2?' –'.repeat(Math.min(Math.round(t.beats)-1,3)):'');   // 兩拍以上補延長線
    frag.appendChild(el);
  }
  stripEl.innerHTML=''; stripEl.appendChild(frag); scoreNodes=[...stripEl.children]; stripEl.scrollTop=0;
  drawRoll(0);
}
/* 多聲部：每一軌各算一份 tokens（offset 補休止、rep 重複），一軌一條捲簾；左邊是這一軌的音量／M／S */
function renderOrch(tune){
  const box=$('lanectl'); box.innerHTML=''; stripEl.innerHTML=''; scoreTokens=[]; scoreNodes=[]; scoreOn=-1;
  lanes=tune.parts.map((p,i)=>{
    const src=p.notes||Musician.fromJianpu(p.jp||'').notes, arr=[];
    if(p.offset) arr.push([null,p.offset]);
    for(let r=0;r<(p.rep||1);r++) for(const n of src) arr.push(n);
    const jp=Musician.toJianpu({bpm:tune.bpm,notes:arr},{floorMidi:0});
    const color=pal['lane'+(i%6+1)];
    const r=document.createElement('div'); r.className='lc'; const vol=p.vol==null?1:p.vol;
    r.innerHTML='<span class="nm"><b style="color:'+color+'">'+p.name+'</b><i>'+TEXT['ui.voice.'+p.voice]+'</i></span>'+
      '<input type="range" min="0" max="1" step="0.05" value="'+vol+'"><button data-k="mute" class="'+(p.mute?'on':'')+'">M</button><button data-k="solo" class="'+(p.solo?'on':'')+'">S</button>';
    r.querySelector('input').oninput=e=>{ p.vol=+e.target.value; Musician.setPart(i,{vol:p.vol}); };
    r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      p[b.dataset.k]=!p[b.dataset.k]; b.classList.toggle('on',p[b.dataset.k]);
      Musician.setPart(i,{[b.dataset.k]:p[b.dataset.k]});
      if(b.dataset.k==='solo') tune.parts.forEach((q,j)=>Musician.setPart(j,{solo:q.solo}));
    });
    box.appendChild(r);
    return {name:p.name,tokens:jp.tokens,color};
  });
  stageEl.style.setProperty('--lanes',lanes.length); stageEl.classList.add('multi'); stagecol.classList.add('multi');
  drawRoll(0);
}
/* 長條圖：橫軸＝時間（固定視窗 8 秒，播放線在左 1/4 處、畫面往左流），縱軸＝音高，一顆音一條。
   單旋律：還沒到＝藍、正在響＝金色發光、剛響完＝淡出、已過＝暗；多軌：用該軌自己的顏色 */
function drawRoll(pos){
  const dpr=window.devicePixelRatio||1, W=rollEl.clientWidth, H=rollEl.clientHeight;
  if(!W||!H) return;
  if(rollEl.width!==Math.round(W*dpr)||rollEl.height!==Math.round(H*dpr)){ rollEl.width=Math.round(W*dpr); rollEl.height=Math.round(H*dpr); }
  rctx.setTransform(dpr,0,0,dpr,0,0); rctx.clearRect(0,0,W,H); rctx.globalAlpha=1;
  const n=lanes.length; if(!n) return;
  const LH=H/n, WIN=8, pps=W/WIN, x0=W*0.25, multi=n>1;
  lanes.forEach((ln,k)=>{
    const toks=ln.tokens, y0=k*LH;
    if(k>0){ rctx.fillStyle=pal.line; rctx.fillRect(0,y0,W,1); }
    let lo=1e9, hi=-1e9; for(const t of toks) if(t.midi!=null){ if(t.midi<lo)lo=t.midi; if(t.midi>hi)hi=t.midi; }
    if(lo>hi) return;
    const padY=8, rows=hi-lo+1, rh=Math.max(3,(LH-2*padY)/rows), base=multi?ln.color:null;
    let a=0,b=toks.length; while(a<b){ const m=(a+b)>>1; if(toks[m].sec+toks[m].dur<pos-0.6) a=m+1; else b=m; }
    for(let i=a;i<toks.length;i++){
      const t=toks[i], x=x0+(t.sec-pos)*pps; if(x>W) break;
      if(t.midi==null) continue;
      const w=Math.max(3,t.dur*pps-2), y=y0+LH-padY-(t.midi-lo+1)*rh+1, end=t.sec+t.dur;
      if(pos>=t.sec && pos<end){ rctx.globalAlpha=1; rctx.fillStyle=base||'#ffd77a'; rctx.shadowColor=base||'rgba(255,200,80,.9)'; rctx.shadowBlur=14; }
      else if(pos>=end){ const f=Math.max(0,1-(pos-end)/0.5);          // 剛響完：0.5 秒淡出
        rctx.shadowBlur=f>0?10*f:0; rctx.shadowColor=base||pal.gold;
        if(f>0){ rctx.globalAlpha=0.25+0.6*f; rctx.fillStyle=base||pal.gold; } else { rctx.globalAlpha=0.28; rctx.fillStyle=pal.muted; } }
      else { rctx.shadowBlur=0; rctx.globalAlpha=multi?0.55:0.7; rctx.fillStyle=base||pal.blue; }
      rctx.fillRect(x,y,w,Math.max(2,rh-2));
    }
    rctx.shadowBlur=0; rctx.globalAlpha=1;
  });
  rctx.fillStyle=pal.text; rctx.globalAlpha=0.5; rctx.fillRect(x0-1,0,2,H); rctx.globalAlpha=1;   // 播放線
}
new ResizeObserver(()=>drawRoll(Math.max(0,Musician.position()))).observe(rollEl);

function tickScore(){
  scoreRAF=0;
  const pos=Musician.position();
  drawRoll(pos<0?0:pos);
  if(scoreTokens.length){
    if(pos<0){ if(scoreOn>=0&&scoreNodes[scoreOn]) scoreNodes[scoreOn].classList.remove('on'); scoreOn=-1; }
    else{
      let i=(scoreOn>=0&&scoreTokens[scoreOn]&&pos>=scoreTokens[scoreOn].sec)?scoreOn:0;
      while(i+1<scoreTokens.length && scoreTokens[i+1].sec<=pos) i++;   // 從上次位置往前走，不必每幀搜整首
      if(i!==scoreOn){
        if(scoreOn>=0&&scoreNodes[scoreOn]){ scoreNodes[scoreOn].classList.remove('on'); scoreNodes[scoreOn].classList.add('done'); }
        const el=scoreNodes[i];
        if(el){
          el.classList.add('on'); el.classList.remove('done');
          const r=el.offsetTop-stripEl.scrollTop;          // 目前這顆快出框就捲到三分之一處
          if(r>stripEl.clientHeight-50||r<0) stripEl.scrollTop=Math.max(0,el.offsetTop-stripEl.clientHeight*0.33);
        }
        scoreOn=i;
      }
    }
  }
  if(pos>=0) scoreRAF=requestAnimationFrame(tickScore);
}
/* 分頁隱藏時瀏覽器不跑 rAF；回到前景要自己接回去 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Musician.position()>=0 && !scoreRAF) scoreRAF=requestAnimationFrame(tickScore); });

/* ── 選曲／播放 ── */
function pick(k,i,play){
  sel={k,i}; try{ localStorage.setItem('musician.last',k+i); }catch(e){}
  const tune=tuneOf(sel);
  $('nowName').textContent=tune.name; $('nowOrig').textContent=k==='t'?(tune.orig||''):'';
  ctl.classList.toggle('orch',k==='o');
  if(k==='t') renderScore(tune); else renderOrch(tune);
  paintCards();
  if(play) playSel();
}
function playSel(){
  if(sel.k==='t'&&!activeVoices.size){ Musician.stop(); playingNow=false; paintCards(); paintPlay(); return; }   // 全關＝靜場
  const tune=tuneOf(sel);
  if(sel.k==='t') Musician.play(tune,{voice:[...activeVoices],cfg:CONFIG,accomp:accOn,onend:handleEnd});
  else Musician.play(tune,{cfg:CONFIG,onend:handleEnd});
  playingNow=true; paintCards(); paintPlay();
  if(!scoreRAF) scoreRAF=requestAnimationFrame(tickScore);
}
function stopAll(){ Musician.stop(); playingNow=false; paintCards(); paintPlay(); }
function paintCards(){
  const isVar=sel&&sel.k==='t'&&TUNES[sel.i].parent, card=sel?CARD[sel.k+sel.i]:null;
  tunesEl.querySelectorAll('.tune').forEach(x=>{
    x.classList.toggle('sel',x===card);
    x.classList.toggle('playing',playingNow&&x===card&&!isVar);   // 播變奏＝只有膠囊發光，卡片本體不亮
  });
  tunesEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('playing',playingNow&&isVar&&+x.dataset.j===sel.i));
}
function paintPlay(){ $('playBtn').textContent=playingNow?'■':'▶'; $('playBtn').title=playingNow?'停止':'播放'; }
$('playBtn').onclick=()=>{ if(playingNow) stopAll(); else if(sel) playSel(); };
$('editBtn').onclick=()=>{   // 拆開來改：把這首交給積木編輯器（localStorage 傳遞）
  try{ localStorage.setItem('composer.import', JSON.stringify(tuneOf(sel))); }catch(e){}
  location.href='composer.html?import=1';
};

/* 播放模式（v1.09.00）：單曲＝播完停；循環＝同一首重來；隨機＝洗牌袋輪播全庫（含變奏，一輪不重複、不跨輪連莊）。曲終才看模式，手點永遠直接播 */
const MODES=['single','loop','shuffle'];
let playMode='single', shuffleBag=[];
function paintMode(){ $('modeBtn').textContent=TEXT['ui.mode.'+playMode]; }
$('modeBtn').onclick=()=>{ playMode=MODES[(MODES.indexOf(playMode)+1)%MODES.length]; paintMode(); };
paintMode();
function nextShuffle(){
  if(!shuffleBag.length){
    shuffleBag=TUNES.map((_,i)=>i);
    for(let i=shuffleBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffleBag[i],shuffleBag[j]]=[shuffleBag[j],shuffleBag[i]];}
    if(shuffleBag.length>1&&sel&&sel.k==='t'&&shuffleBag[shuffleBag.length-1]===sel.i)
      [shuffleBag[shuffleBag.length-1],shuffleBag[0]]=[shuffleBag[0],shuffleBag[shuffleBag.length-1]];
  }
  return shuffleBag.pop();
}
function handleEnd(){
  if(playMode==='loop') playSel();
  else if(playMode==='shuffle') pick('t',nextShuffle(),true);
  else { playingNow=false; paintCards(); paintPlay(); }
}

/* 靜音鈕（v1.13.00）：狀態記在 localStorage；走引擎的常駐靜音閘，播放中按下去立刻沒聲音 */
const MUTE_KEY='musician.muted', muteBtn=$('muteBtn');
let uiMuted=false; try{ uiMuted=localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}
function paintMute(){ muteBtn.textContent=uiMuted?'🔇':'🔊'; muteBtn.classList.toggle('off',uiMuted); }
muteBtn.onclick=()=>{ uiMuted=!uiMuted; Musician.setMuted(uiMuted); try{ localStorage.setItem(MUTE_KEY,uiMuted?'1':'0'); }catch(e){} paintMute(); };
paintMute(); if(uiMuted) Musician.setMuted(true);

  theme:{ bg:c('bg'), text:c('text'), accent:c('gold'), accent2:c('blue'), field:c('panel2'), line:c('line'), muted:c('muted'), danger:'#c05555' },
  /* 音色參數改了要重按才聽得到（整首是預先排程的）——播放中就自動重按同一首 */
  onChange:()=>{ if(playingNow) playSel(); },
}); }
/* 面板把手 ⚙ 搬進控制列，不再浮在內容上 */
{ const h=document.getElementById('dp-handle'); if(h){ Object.assign(h.style,{position:'static',left:'auto',bottom:'auto',flex:'none'}); ctl.appendChild(h); } }

/* 開頁：選好上次那首（或第一首）放在舞台上，不自動播——舞台不空 */
{ let s=null; try{ s=localStorage.getItem('musician.last'); }catch(e){}
  let k='t', i=-1;
  if(s&&/^[to]\d+$/.test(s)){ k=s[0]; i=+s.slice(1); }
  if(!((k==='t'&&TUNES[i])||(k==='o'&&ORCH_TUNES[i]))){ k='t'; i=+document.querySelector('.tune[data-k^="t"]').dataset.k.slice(1); }
  pick(k,i,false); paintPlay(); }
