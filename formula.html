<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公式作曲台 · Royal Musician</title>
<link rel="stylesheet" href="musician-theme.css?v=1.26.00">
<script src="musician-shell.js?v=1.26.00"></script>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font:18px/1.5 "Noto Sans TC","Microsoft JhengHei",sans-serif; padding:16px; display:flex; flex-direction:column; align-items:center; gap:14px; min-height:100vh;}
  button,select,input{font:inherit; color:inherit;}
  button,select{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 14px; cursor:pointer; min-height:44px;}
  button:hover{border-color:var(--blue);}
  main{width:min(1500px,100%); display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:1000px){ main{grid-template-columns:minmax(520px,6fr) 5fr; align-items:start;} }
  .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px;}
  label.f{color:var(--muted); font-size:15px; display:flex; flex-direction:column; gap:4px;}
  input[type=text]{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-family:Consolas,"Courier New",monospace; font-size:18px; color:var(--gold);}
  input[type=text].bad{border-color:var(--bad);}
  input[type=number]{width:76px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; color:var(--gold); min-height:44px;}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chips button{font-size:16px; padding:6px 12px;}
  #err{color:var(--bad); min-height:1.5em; font-size:16px;}
  #go{border-color:var(--gold); color:var(--gold); padding:6px 32px;}
  .trk{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--panel2);}
  .trk .th{display:flex; gap:8px; align-items:center;}
  .trk .th b{width:14px; height:14px; border-radius:50%; flex:none;}
  .trk .th input.nm{flex:1; min-width:0; background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--text); font-size:18px; padding:4px;}
  .trk .th label{display:flex; gap:6px; align-items:center; color:var(--muted); font-size:15px;}
  .trk .th input[type=checkbox]{width:22px; height:22px;}
  .trk .th button.x{padding:2px 12px;}
  #plot{width:100%; height:clamp(220px,40vh,520px); background:var(--bg); border:1px solid var(--line); border-radius:12px; display:block;}
  #now{min-height:2.2em; font-size:22px; color:var(--gold); font-family:Consolas,monospace; display:flex; gap:18px; flex-wrap:wrap;}
  #now span{white-space:nowrap;}
  #names{color:var(--muted); font-size:15px; word-break:break-all; max-height:9em; overflow:auto;}
</style>
</head>
<body>
<header class="mtop" style="width:min(1500px,100%)"><h1>公式作曲台</h1><span id="mnav" data-page="formula"></span></header>
<main>
  <section class="box">
    <div id="tracks" style="display:flex; flex-direction:column; gap:10px;"></div>
    <div class="row"><button id="addTrk">＋ 加一軌</button>
      <label class="f">音數<input type="number" id="cnt" min="1" max="512" value="32"></label>
      <label class="f">拍數（脈衝軌）<input type="number" id="beats" min="1" max="256" value="16"></label>
      <label class="f">播完後<select id="mode"><option value="continue">接續演化（無限）</option><option value="repeat">原段循環</option><option value="once">只播一次</option></select></label>
      <label class="f">速度<input type="number" id="bpm" min="40" max="240" value="120"></label>
      <label class="f">音階<select id="sc"><option value="major">大調</option><option value="minor">小調</option><option value="pentatonic">五聲</option><option value="chromatic">半音階</option></select></label>
      <label class="f">範圍（八度）<input type="number" id="span" min="1" max="4" value="2"></label>
    </div>
    <div id="err"></div>
    <div class="row"><button id="go">▶ 演奏</button><button id="stop">■ 停止</button><button id="copy">複製連結</button></div>
    <div class="chips" id="presets"></div>
    <details id="videoBox" open><summary style="cursor:pointer;color:var(--gold);font-size:18px;padding:6px 0">影片重現——《Math Functions That Go Insanely Hard》逐段</summary>
      <div class="chips" id="video" style="margin:6px 0"></div>
      <div id="vinfo" style="font-size:15px;color:var(--muted);line-height:1.6"></div></details>
    <details id="classicsBox" open><summary style="cursor:pointer;color:var(--gold);font-size:18px;padding:6px 0">經典公式圖鑑——點一條就聽</summary>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--text);margin:6px 0"><input type="checkbox" id="addMode" style="width:22px;height:22px">加成新一軌（不取代目前的）</label>
      <div id="classics"></div></details>
  </section>
  <section class="box">
    <div id="now"></div>
    <canvas id="plot"></canvas>
    <div id="names"></div>
  </section>
</main>

<script src="config.js?v=1.26.00"></script>
<script src="strings.zh.js?v=1.26.00"></script>
<script src="musician.js?v=1.26.00"></script>
<script src="classics.js?v=1.26.00"></script>
<script>
const $=id=>document.getElementById(id);
const COLORS=['#d4a94a','#7ea7d8','#e08a8a','#8ad4a0','#c49ae0','#e0c48a'];
const VOICES=Musician.voices.filter(v=>!Musician.isSampled(v));
/* 一軌＝{name, kind:'pitch'|'pulse', f 公式, r 時值公式（pitch）, voice, base 八度, vol, bounce, bell, wave 波形算式（voice=wave）, mute}
   pitch：n → 音級（旋律／低音）；pulse：b（第幾拍）→ 這一拍打幾下（鼓點、爬升） */
const T=(o)=>Object.assign({name:'旋律',kind:'pitch',f:'floor(7*frac(n*phi))',r:'',voice:'fm',base:4,vol:0.8,bounce:0,bell:0,wave:'',mute:false},o);
const PRESETS=[
  ['黃金比（單軌）', {bpm:120,tracks:[T({})]}],
  ['影片終局：怪物＋脈衝', {bpm:128,tracks:[
    T({name:'鼓',kind:'pulse',f:'1+mod(b,4)',voice:'kick',base:2,vol:0.9}),
    T({name:'低音',f:'floor(3*frac(n*phi))',r:'2',voice:'bounce',base:2,vol:0.9,bounce:1}),
    T({name:'怪物',f:'floor(7*frac(n*phi))+2',r:'0.5',voice:'monster',base:4,vol:0.7,bell:0.3})]}],
  ['指數爬升', {bpm:120,tracks:[
    T({name:'鼓',kind:'pulse',f:'1+floor(7*(exp(3*x)-1)/(exp(3)-1))',voice:'kick',base:2,vol:0.8}),
    T({name:'嗆',kind:'pulse',f:'floor(8*(exp(3*x)-1)/(exp(3)-1))',voice:'hat',base:6,vol:0.5}),
    T({name:'升音',f:'floor(n/3)',r:'1',voice:'folder',base:4,vol:0.5,bell:0.35})]}],
  ['hardbass 波形公式', {bpm:150,tracks:[
    T({name:'鼓',kind:'pulse',f:'1',voice:'kick',base:2,vol:0.9}),
    T({name:'咬音',f:'2*floor(3*frac(n*phi))',r:'1',voice:'wave',base:3,vol:0.8,wave:'sin(2*pi*f*t+(0.6+4.4*exp(-t*9))*sin(4*pi*f*t))*exp(-t*3)'})]}],
  ['圓周率', {bpm:110,tracks:[T({f:'floor(10*frac(pi*n))',voice:'crystal',base:5,vol:0.7})]}],
];
let state=null, tune=null;
const voiceOpts=sel=>VOICES.map(v=>'<option value="'+v+'"'+(v===sel?' selected':'')+'>'+(TEXT['ui.voice.'+v]||v)+'</option>').join('');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function paintTracks(){
  $('tracks').innerHTML=state.tracks.map((t,i)=>
    '<div class="trk" data-i="'+i+'"><div class="th"><b style="background:'+COLORS[i%COLORS.length]+'"></b><input class="nm" data-k="name" value="'+esc(t.name)+'">'+
    '<label><input type="checkbox" data-k="mute"'+(t.mute?' checked':'')+'>靜音</label><button class="x" title="刪除這軌">✕</button></div>'+
    '<div class="row"><label class="f">類型<select data-k="kind"><option value="pitch"'+(t.kind==='pitch'?' selected':'')+'>音高公式 n→音級</option><option value="pulse"'+(t.kind==='pulse'?' selected':'')+'>脈衝公式 b→每拍幾下</option></select></label>'+
    '<label class="f">音色<select data-k="voice">'+voiceOpts(t.voice)+'</select></label>'+
    '<label class="f">八度<input type="number" data-k="base" min="0" max="7" value="'+t.base+'"></label>'+
    '<label class="f">音量<input type="number" data-k="vol" min="0" max="1" step="0.1" value="'+t.vol+'"></label>'+
    '<label class="f">彈跳<input type="number" data-k="bounce" min="0" max="3" step="0.5" value="'+t.bounce+'"></label>'+
    '<label class="f">鐘形<input type="number" data-k="bell" min="0" max="1" step="0.05" value="'+t.bell+'"></label></div>'+
    '<label class="f">'+(t.kind==='pulse'?'每拍打幾下（b＝第幾拍，x＝b/拍數）':'音級（n＝第幾顆音，x＝n/音數）')+'<input type="text" data-k="f" spellcheck="false" value="'+esc(t.f)+'"></label>'+
    (t.kind==='pitch'?'<label class="f">時值（拍）<input type="text" data-k="r" spellcheck="false" placeholder="1" value="'+esc(t.r)+'"></label>':'')+
    (t.voice==='wave'?'<label class="f">波形（t 秒、f 本音 Hz）<input type="text" data-k="wave" spellcheck="false" value="'+esc(t.wave)+'"></label>':'')+
    '</div>').join('');
}
$('tracks').addEventListener('input',e=>{ const k=e.target.dataset.k, i=e.target.closest('.trk').dataset.i; if(!k) return;
  const t=state.tracks[i]; t[k]=e.target.type==='checkbox'?e.target.checked:(e.target.type==='number'?+e.target.value:e.target.value);
  if(k==='kind'||k==='voice'){ if(k==='voice'&&t.voice==='wave'&&!t.wave) t.wave='sin(2*pi*f*t)*exp(-t*4)'; paintTracks(); }
  const ok=build(false);
  if(playing&&ok&&(k==='kind'||k==='voice')) go();   // 下拉選單重畫後原元素已換掉、change 事件到不了，所以這兩項在這裡直接重播
  if(playing&&(k==='vol'||k==='mute')) Musician.setPart(+i,{vol:t.vol,mute:t.mute}); });   // 音量／靜音：播放中即時生效，不重播
/* 其餘改動（音色、公式、彈跳、鐘形、八度…）：整段是開播時預先排好的，所以播放中改了就用新設定重播這一段（同一段、從頭）。
   文字框等 change（按 Enter／離開欄位）才重播，避免打一個字重播一次 */
$('tracks').addEventListener('change',e=>{ const k=e.target.dataset.k; if(!k||k==='vol'||k==='mute'||k==='name'||!playing) return; if(build(false)) go(); });
$('tracks').addEventListener('click',e=>{ if(!e.target.classList.contains('x')) return; state.tracks.splice(+e.target.closest('.trk').dataset.i,1); paintTracks(); build(false); });
$('addTrk').onclick=()=>{ if(state.tracks.length>=6) return; state.tracks.push(T({name:'軌 '+(state.tracks.length+1),f:'n',voice:'piano'})); paintTracks(); build(false); };
$('presets').innerHTML=PRESETS.map((p,i)=>'<button data-i="'+i+'">'+p[0]+'</button>').join('');
$('presets').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; load(JSON.parse(JSON.stringify(PRESETS[b.dataset.i][1]))); startFresh(); };
/* 經典公式圖鑑：點一條＝載入並播放。pitch 配鋼琴好聽的音色；pulse 自動配一條低音墊底；wave 用波形公式音色＋一條黃金比旋律 */
{ const groups={}; CLASSICS.forEach((c,i)=>{ (groups[c.g]=groups[c.g]||[]).push([c,i]); });
  $('classics').innerHTML=Object.keys(groups).map(g=>'<div style="color:var(--muted);font-size:14px;margin:8px 0 4px">'+g+'</div><div class="chips">'+groups[g].map(([c,i])=>'<button data-c="'+i+'" title="'+esc((c.f||c.w)+(c.note?'　'+c.note:''))+'">'+c.name+'</button>').join('')+'</div>').join(''); }
$('classics').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const c=CLASSICS[b.dataset.c];
  let trk;
  if(c.kind==='pitch') trk=T({name:c.name,f:c.f,voice:'piano',base:4,vol:0.8});
  else if(c.kind==='pulse') trk=T({name:c.name,kind:'pulse',f:c.f,voice:'kick',base:2,vol:0.9});
  else trk=T({name:c.name,f:'2*floor(3*frac(n*phi))',r:'1',voice:'wave',base:3,vol:0.8,wave:c.w});
  let tracks;
  if($('addMode').checked&&state.tracks.length<6) tracks=state.tracks.concat([trk]);
  else if(c.kind==='pulse') tracks=[trk,T({name:'低音',f:'floor(3*frac(n*phi))',r:'2',voice:'bounce',base:2,vol:0.8,bounce:1})];
  else tracks=[trk];
  state.tracks=tracks; paintTracks(); startFresh(); };
/* 影片重現：每段一組軌；點了載入、顯示畫面上的公式與字幕、播放 */
$('video').innerHTML=VIDEO.map((v,i)=>'<button data-v="'+i+'">'+v.name+'</button>').join('');
$('video').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const v=VIDEO[b.dataset.v];
  load({bpm:v.bpm,tracks:v.tracks.map(t=>T(JSON.parse(JSON.stringify(t))))});
  $('vinfo').innerHTML='<div style="color:var(--gold);font-size:17px">“'+esc(v.caption)+'”</div><div style="font-family:Consolas,monospace;color:var(--text)">'+esc(v.shown)+'</div><div>'+esc(v.note)+'</div>';
  startFresh(); };
function load(s){ state=s; $('bpm').value=s.bpm||120; paintTracks(); }

let chunk=0, playing=false, raf=0;   // 持續播放：每一段接著上一段的 n 往下算（旋律繼續演化，不是原曲重複）
let offs=[], used=[];   // 每軌「接續演化」已經用掉幾個 n（或拍）；每段長度不同，所以每軌各記各的
const trunc=(notes,L)=>{ const out=[]; let acc=0; for(const n of notes){ if(acc+n[1]>L+1e-9){ if(L-acc>1e-6) out.push([n[0],L-acc]); break; } out.push(n); acc+=n[1]; if(acc>=L-1e-9) break; } return out; };
const total=notes=>notes.reduce((x,n)=>x+n[1],0);
function build(play){
  $('err').textContent=''; document.querySelectorAll('.trk input.bad').forEach(x=>x.classList.remove('bad'));
  const cnt=+$('cnt').value, beats=+$('beats').value, sc=$('sc').value, span=+$('span').value;
  const parts=[]; used=[];
  try{
    const mk=(t,i,n,off)=>{ try{ return Musician.fromFormula(t.f,{n,scale:sc,span,base:t.base,rhythm:t.r,offset:off}).notes; }
      catch(e){ const el=document.querySelector('.trk[data-i="'+i+'"] input[data-k="f"]'); if(el) el.classList.add('bad'); throw new Error('「'+t.name+'」：'+e.message); } };
    const pulse=(t,i,off)=>{ try{ return Musician.fromPulse(t.f,{beats,pitch:'C'+t.base,offset:off}).notes; }
      catch(e){ const el=document.querySelector('.trk[data-i="'+i+'"] input[data-k="f"]'); if(el) el.classList.add('bad'); throw new Error('「'+t.name+'」：'+e.message); } };
    // 第一輪：音高軌先照「音數」生一遍，量出整段長度 L＝最長的那一軌；沒有音高軌就用「拍數」
    const nat=state.tracks.map((t,i)=>t.kind==='pitch'?mk(t,i,cnt,offs[i]||0):null);
    let L=Math.max(0,...nat.filter(Boolean).map(total)); if(!(L>0)) L=beats;
    // 第二輪：每一軌都補到 L 一樣長（太短的鼓／旋律會「播一小段就沒了」）
    state.tracks.forEach((t,i)=>{
      let notes, u;
      if(t.kind==='pitch'){
        notes=nat[i]; u=cnt;
        if(total(notes)<L-1e-9){ const per=total(notes)/cnt||1; u=Math.min(512,Math.ceil(L/per)+1); notes=mk(t,i,u,offs[i]||0); }
        notes=trunc(notes,L);
        // used＝實際用掉幾顆音（下一段從這裡接續）
        u=Math.min(u,notes.length);
      }else{
        const cycles=Math.max(1,Math.ceil(L/beats)); notes=[];
        for(let c=0;c<cycles;c++) notes=notes.concat(pulse(t,i,(offs[i]||0)+c*beats));
        notes=trunc(notes,L); u=cycles*beats;
      }
      if(t.voice==='wave'){ try{ Musician.compileFormula(t.wave||'0'); }catch(e){ throw new Error('「'+t.name+'」波形：'+e.message); } }
      used[i]=u;
      const P={}; if(t.bounce>0) P.bounce=t.bounce; if(t.bell>0) P.bell=t.bell; if(t.voice==='wave') P.expr=t.wave;
      parts.push({name:t.name,voice:t.voice,vol:t.vol,mute:t.mute,notes,P,_kind:t.kind});
    });
  }catch(e){ $('err').textContent=e.message; tune=null; draw(); return false; }
  tune={id:'formula',name:'公式',composer:'公式作曲',bpm:+$('bpm').value||120,chords:false,parts};
  draw(); if(play) go(); return true;
}
function go(){
  if(!tune&&!build(false)) return; if(!tune.parts.length){ $('err').textContent='至少要有一軌'; return; }
  Musician.stop(); playing=true;
  Musician.play(tune,{cfg:CONFIG,onend:()=>{ const m=$('mode').value; if(!playing||m==='once'){ playing=false; return; } if(m==='continue'){ chunk++; used.forEach((u,i)=>{ offs[i]=(offs[i]||0)+u; }); } if(build(false)) go(); else playing=false; }});
  if(!raf) raf=requestAnimationFrame(frame);
}
function startFresh(){ chunk=0; offs=[]; if(build(false)) go(); }
function draw(pos){
  if(pos==null) pos=-1;
  const c=$('plot'), r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr); if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width, H=r.height; g.clearRect(0,0,W,H);
  if(!tune||!tune.parts.length){ $('names').textContent=''; return; }
  const midi=x=>{ const m=/^([A-G])(#?)(\d)$/.exec(x), B={C:0,D:2,E:4,F:5,G:7,A:9,B:11}; return 12*(+m[3]+1)+B[m[1]]+(m[2]?1:0); };
  const sum=p=>p.notes.reduce((s,n)=>s+n[1],0), total=Math.max(...tune.parts.map(sum));
  const all=tune.parts.filter(p=>p._kind==='pitch').flatMap(p=>p.notes.filter(n=>n[0]).map(n=>midi(n[0])));
  const lo=Math.min(...all,48)-1, hi=Math.max(...all,72)+1;
  g.strokeStyle='#2a2f52'; g.lineWidth=1;
  for(let m=Math.ceil(lo);m<=hi;m++) if(m%12===0){ const y=H-(m-lo)/(hi-lo)*H; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  const beatNow=pos>=0?pos/(60/tune.bpm):-1, cur=[];
  tune.parts.forEach((p,i)=>{
    g.fillStyle=COLORS[i%COLORS.length]; g.globalAlpha=p.mute?0.25:1; let t=0; let hit=null;
    for(const n of p.notes){
      const x=t/total*W, on=beatNow>=t&&beatNow<t+n[1]&&n[0];
      if(on) hit=n[0];
      if(n[0]){ if(p._kind==='pulse'){ g.fillRect(x,H-14,Math.max(2,n[1]/total*W-1),12); if(on){ g.strokeStyle='#fff'; g.lineWidth=2; g.strokeRect(x-1,H-16,Math.max(4,n[1]/total*W+1),16); } }
        else{ const y=H-(midi(n[0])-lo)/(hi-lo)*H, w=Math.max(3,n[1]/total*W-2);
          if(on){ g.fillRect(x-2,y-9,w+4,18); g.strokeStyle='#fff'; g.lineWidth=2; g.strokeRect(x-2,y-9,w+4,18); } else g.fillRect(x,y-4,w,8); } }
      t+=n[1];
    }
    cur.push([p.name,hit,COLORS[i%COLORS.length]]);
  });
  g.globalAlpha=1;
  if(beatNow>=0){ const x=Math.min(1,beatNow/total)*W; g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  $('now').innerHTML=beatNow>=0?(cur.map(c=>'<span style="color:'+c[2]+'">'+c[0]+' '+(c[1]||'·')+'</span>').join('')+'<span style="color:var(--muted)">第 '+(chunk+1)+' 段・第 '+(Math.floor(beatNow)+1)+' 拍</span>'):'';
  const nm=tune.parts.map(p=>p.name+'：'+p.notes.slice(0,48).map(n=>n[0]||'0').join(' ')).join('\n');
  if($('names').textContent!==nm){ $('names').textContent=nm; $('names').style.whiteSpace='pre-wrap'; }
}
$('go').onclick=startFresh;
$('stop').onclick=()=>{ playing=false; Musician.stop(); draw(-1); };
function frame(){ raf=0; draw(playing?Musician.position():-1); if(playing) raf=requestAnimationFrame(frame); }
for(const id of ['cnt','beats','bpm','sc','span']) $(id).addEventListener('input',()=>build(false));
for(const id of ['cnt','beats','bpm','sc','span']) $(id).addEventListener('change',()=>{ if(playing&&build(false)) go(); });
$('copy').onclick=()=>{
  const s=Object.assign({},state,{bpm:+$('bpm').value,cnt:+$('cnt').value,beats:+$('beats').value,sc:$('sc').value,span:+$('span').value});
  const u=location.origin+location.pathname+'?s='+encodeURIComponent(JSON.stringify(s));
  try{ navigator.clipboard.writeText(u); $('err').style.color='var(--gold)'; $('err').textContent='連結已複製'; setTimeout(()=>{$('err').textContent='';$('err').style.color='';},1500); }catch(e){}
};
{ let s=null;   // 分享連結：只當資料讀進輸入框，公式仍走同一個白名單解析器
  try{ const q=new URLSearchParams(location.search).get('s'); if(q) s=JSON.parse(q); }catch(e){}
  if(s&&Array.isArray(s.tracks)&&s.tracks.length<=6){
    s.tracks=s.tracks.map(t=>T(Object.assign({},t,{voice:VOICES.includes(t.voice)?t.voice:'piano'})));
    for(const [k,id] of [['cnt','cnt'],['beats','beats'],['sc','sc'],['span','span']]) if(s[k]!=null) $(id).value=s[k];
    load(s);
  } else load(JSON.parse(JSON.stringify(PRESETS[1][1]))); }
window.addEventListener('resize',draw);
build(false);
</script>
